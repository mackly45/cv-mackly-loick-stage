<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Non Trouvée - Mackly Loick Tchicaya</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    
    <!-- Font Awesome CSS -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.0/css/all.css">
    
    <!-- Main CSS -->
    <link rel="stylesheet" href="assets/css/main.css">

    <style>
        /* Enhanced Body Styling */
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            line-height: 1.6;
            padding-top: 80px;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 212, 255, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(255, 64, 129, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 50% 50%, rgba(0, 255, 136, 0.03) 0%, transparent 30%);
            background-attachment: fixed;
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at center, rgba(0, 212, 255, 0.03) 0%, transparent 70%),
                linear-gradient(to bottom, rgba(10, 10, 10, 0.9) 0%, rgba(10, 10, 10, 0.95) 100%);
            z-index: -1;
            animation: backgroundShift 20s ease-in-out infinite alternate;
        }

        @keyframes backgroundShift {
            0% {
                opacity: 0.5;
                transform: scale(1);
            }
            100% {
                opacity: 1;
                transform: scale(1.05);
            }
        }

        /* Floating Elements for Depth */
        .floating-element {
            position: fixed;
            border-radius: 50%;
            background: var(--gradient-3);
            opacity: 0.1;
            z-index: -1;
            animation: floatElement 15s infinite ease-in-out;
            filter: blur(20px);
        }

        .floating-element:nth-child(1) {
            width: 150px;
            height: 150px;
            top: 10%;
            left: 5%;
            animation-delay: 0s;
        }

        .floating-element:nth-child(2) {
            width: 100px;
            height: 100px;
            bottom: 15%;
            right: 10%;
            animation-delay: 2s;
        }

        .floating-element:nth-child(3) {
            width: 200px;
            height: 200px;
            top: 40%;
            right: 20%;
            animation-delay: 4s;
        }

        @keyframes floatElement {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(20px, -30px) scale(1.1);
            }
            50% {
                transform: translate(-15px, 20px) scale(0.9);
            }
            75% {
                transform: translate(10px, 30px) scale(1.05);
            }
        }
        
        .error-container {
            max-width: 600px;
            padding: 40px;
            background: rgba(26, 26, 26, 0.8);
            border-radius: 20px;
            border: 1px solid rgba(0, 212, 255, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
            animation: fadeInUp 0.6s ease-out;
        }
        
        .error-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--gradient-3);
            transform: scaleX(0);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .error-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--gradient-3);
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: -1;
            border-radius: 20px;
        }
        
        .error-container:hover::before {
            transform: scaleX(1);
        }
        
        .error-container:hover::after {
            opacity: 0.1;
        }
        
        .error-code {
            font-size: 6rem;
            font-weight: 800;
            margin: 0;
            background: var(--gradient-3);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textGlow 3s ease-in-out infinite alternate;
        }
        
        .error-title {
            font-size: 2.5rem;
            margin: 20px 0;
            color: var(--text-primary);
            position: relative;
        }
        
        .error-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 4px;
            background: var(--gradient-3);
            border-radius: 4px;
            transform: translateX(-50%) scaleX(0);
            transition: transform 0.3s ease;
        }
        
        .error-container:hover .error-title::after {
            transform: translateX(-50%) scaleX(1);
        }
        
        .error-message {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .btn-primary {
            display: inline-block;
            padding: 15px 35px;
            margin: 10px;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            z-index: 1;
            cursor: pointer;
            transform: translateY(0);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            background: var(--gradient-3);
            color: white;
        }
        
        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--gradient-2);
            transition: all 0.4s ease;
            z-index: -1;
        }
        
        .btn-primary:hover::before {
            left: 0;
        }
        
        .btn-primary:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
            color: white;
            text-decoration: none;
        }
        
        .btn-primary:active {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px) rotateX(10deg);
            }
            to {
                opacity: 1;
                transform: translateY(0) rotateX(0);
            }
        }
        
        @keyframes textGlow {
            0% {
                text-shadow: 0 5px 15px rgba(0, 212, 255, 0.3);
            }
            100% {
                text-shadow: 0 5px 25px rgba(0, 212, 255, 0.6), 0 0 30px rgba(0, 212, 255, 0.4);
            }
        }
    </style>
</head>
<body>
    <!-- Particles Background -->
    <div id="particles-js"></div>
    
    <!-- Floating Elements for Depth -->
    <div class="floating-element"></div>
    <div class="floating-element"></div>
    <div class="floating-element"></div>
    
    <div class="error-container">
        <h1 class="error-code">404</h1>
        <h2 class="error-title">Page Non Trouvée</h2>
        <p class="error-message">
            Désolé, la page que vous recherchez semble avoir disparu dans le néant digital. 
            Mais pas d'inquiétude, vous pouvez retourner à la page d'accueil de mon portfolio.
        </p>
        <a href="tchicaya.html" class="btn-primary">
            <i class="fas fa-home"></i> Retour à l'Accueil
        </a>
    </div>
</body>
</html>
